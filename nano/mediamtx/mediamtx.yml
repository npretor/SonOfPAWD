# MediaMTX config for SonOfPAWD.
# The Nano's camera-pipeline publishes into 'live' (rtspclientsink, TCP); MediaMTX
# serves it to the browser UI (WebRTC/WHEP), inference and recorder.
# Defaults elsewhere are fine; keep this file minimal.

# WebRTC ICE: advertise only the LAN interface. Auto-discovery was picking up
# docker0 (172.17.0.1) and handing that to the browser, which obviously
# couldn't route to it — ICE would fail and you'd get a black screen.
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList: [wlan0]

paths:
  live:
    source: publisher

  # Low-quality path for poor network conditions. Spun up on-demand via FFmpeg
  # (transcodes from the already-warm 'live' path to 640x360 @ ~600 kbps).
  # Requires ffmpeg to be installed on the Nano.
  live_low:
    runOnDemand: >-
      ffmpeg -rtsp_transport tcp -i rtsp://localhost:$RTSP_PORT/live
      -vf scale=640:360 -c:v libx264 -preset ultrafast -tune zerolatency
      -b:v 600k -g 60 -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
